# Runs on every push and pull request, on Windows, with two Python versions:
# the oldest we support (3.10) and a current one. The tests use a fake model
# (tests/fakes.py) and the live test is deselected by default (pytest.ini), so
# nothing here needs Ollama or a model download.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Type hints are correct (mypy)
        run: mypy

      - name: Tests (the model is faked; the live test is skipped)
        run: python -m pytest -q

      # Fails the build when a new advisory is published for a pinned dependency,
      # which is exactly when someone should look at it.
      - name: Known vulnerabilities in the dependencies (pip-audit)
        run: pip-audit -r requirements.txt
