[pytest]
testpaths = tests
# "." lets the tests import our code (summarizer/, cli.py);
# "tests" lets them import the helpers in tests/ (fakes.py, schema_check.py).
pythonpath = . tests
markers =
    live: runs the real model; needs Ollama (run with: python -m pytest -m live)
# By default, skip the live tests so the suite stays fast and needs no Ollama.
addopts = -m "not live"
